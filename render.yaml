services:
  - type: web
    name: vigente-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    buildFilter:
      ignoredPaths:
        - apps/web/**
        - packages/**
        - docs/**
        - '**/*.md'
        - platanus-hack-project.jsonc
        - project-logo.png
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: '10000'
      - key: DATABASE_URL
        fromDatabase:
          name: vigente-db
          property: connectionString
      - key: CORS_ALLOW_ORIGINS
        sync: false
      - key: APS_CLIENT_ID
        sync: false
      - key: APS_CLIENT_SECRET
        sync: false
      - key: APS_CALLBACK_URL
        value: https://hack-team-27.vercel.app/api/integrations/aps/callback
      - key: APS_TOKEN_KEY
        sync: false
      - key: APS_WEBHOOK_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://hack-team-27.vercel.app/api/integrations/google/callback
      - key: INTEGRATIONS_ENCRYPTION_KEY
        generateValue: true
      - key: GOOGLE_WEBHOOK_URL
        value: https://vigente-api.onrender.com/api/integrations/google/notifications

databases:
  - name: vigente-db
    databaseName: vigente
    user: vigente
    plan: free
    region: virginia

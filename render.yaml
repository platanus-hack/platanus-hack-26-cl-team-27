services:
  - type: web
    name: vigente-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    buildFilter:
      ignoredPaths:
        - apps/web/**
        - apps/etl/**
        - apps/aps/**
        - packages/**
        - docs/**
        - tool-use-case/**
        - '**/*.md'
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: '10000'
      - key: DATABASE_URL
        fromDatabase:
          name: vigente-db
          property: connectionString
      - key: PRESENTER_KEY
        generateValue: true
      - key: CORS_ALLOW_ORIGINS
        sync: false
      - key: APS_CLIENT_ID
        sync: false
      - key: APS_CLIENT_SECRET
        sync: false
      - key: APS_BUCKET_KEY
        value: vigente-956d852fc0a3c635

databases:
  - name: vigente-db
    databaseName: vigente
    user: vigente
    plan: free
    region: virginia
